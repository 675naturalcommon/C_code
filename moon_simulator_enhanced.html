<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级月相模拟器 - 优化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            color: #f0f0f0;
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
            position: relative;
        }

        #canvasContainer {
            flex: 1;
            position: relative;
            background: #000;
        }

        canvas {
            display: block;
            outline: none;
            width: 100%;
            height: 100%;
        }

        #controls {
            width: 350px;
            background: rgba(10, 15, 30, 0.95);
            padding: 25px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }

        .controls-section {
            background: rgba(20, 25, 40, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .controls-section:hover {
            border-color: rgba(122, 184, 255, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #7ab8ff;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(122, 184, 255, 0.2);
        }

        h2 i {
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c0c8e0;
            font-weight: 500;
        }

        input, select, button {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 25, 45, 0.9);
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.2);
        }

        button {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .info-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .info-item {
            background: linear-gradient(145deg, rgba(30, 40, 60, 0.8), rgba(20, 30, 50, 0.8));
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-3px);
            border-color: rgba(122, 184, 255, 0.3);
        }

        .info-label {
            font-size: 12px;
            color: #8a9bb8;
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .phase-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 25px 0;
            padding: 20px;
            background: rgba(15, 25, 45, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .moon-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(90deg, #000 0%, #333 50%, #666 100%);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .phase-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(to right, #111 0%, #444 100%);
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 50%;
        }

        .phase-name {
            font-size: 24px;
            font-weight: 800;
            margin: 15px 0;
            background: linear-gradient(135deg, #7ab8ff, #a8d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .slider-value {
            color: #4a9eff;
            font-weight: 700;
            font-size: 16px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(30, 40, 60, 0.8), rgba(74, 158, 255, 0.8));
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4a9eff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.8);
            border: 2px solid white;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(74, 158, 255, 1);
        }

        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #fff;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 25, 45, 0.9);
            border-radius: 12px;
            padding: 15px;
            max-width: 250px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #7ab8ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-info {
            font-size: 13px;
            line-height: 1.5;
            color: #c0d0f0;
        }

        .hud-info p {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-info i {
            color: #4a9eff;
            width: 14px;
        }

        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 380px;
            background: rgba(15, 25, 45, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(25, 35, 55, 0.95);
            border-color: rgba(122, 184, 255, 0.5);
        }

        @media (max-width: 1200px) {
            #controls {
                position: absolute;
                top: 0;
                right: 0;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 50;
            }

            #controls.active {
                transform: translateX(0);
            }

            .toggle-btn {
                right: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>
    <div id="status"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>

    <div class="hud">
        <div class="hud-title"><i class="fas fa-info-circle"></i> 操作指南</div>
        <div class="hud-info">
            <p><i class="fas fa-mouse-pointer"></i> 左键拖动旋转视图</p>
            <p><i class="fas fa-mouse"></i> 滚轮缩放视图</p>
            <p><i class="fas fa-sliders-h"></i> 右侧面板调整参数</p>
            <p><i class="fas fa-moon"></i> 月球自动旋转中</p>
        </div>
    </div>

    <button class="toggle-btn" id="toggleControls">
        <i class="fas fa-cogs"></i>
    </button>

    <div id="app">
        <div id="canvasContainer">
            <canvas id="moonCanvas"></canvas>
        </div>

        <div id="controls" class="active">
            <div class="controls-section">
                <h2><i class="fas fa-calendar-alt"></i> 日期时间</h2>
                <div class="form-group">
                    <label for="date"><i class="far fa-calendar"></i> 选择日期</label>
                    <input type="date" id="date" value="2024-01-01">
                </div>
                <div class="form-group">
                    <label for="time"><i class="far fa-clock"></i> 选择时间</label>
                    <input type="time" id="time" value="12:00">
                </div>
                <button id="useCurrentTime">
                    <i class="fas fa-clock"></i> 使用当前时间
                </button>
            </div>

            <div class="controls-section">
                <h2><i class="fas fa-moon"></i> 月相信息</h2>
                <div class="phase-visual">
                    <div class="moon-icon">
                        <div class="phase-fill" id="phaseFill" style="width: 100%"></div>
                    </div>
                    <div class="phase-name" id="phaseName">满月</div>
                </div>
                <div class="info-display">
                    <div class="info-item">
                        <div class="info-label">照明比例</div>
                        <div class="info-value" id="illumination">100%</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">月龄</div>
                        <div class="info-value" id="moonAge">14.8 天</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">距地球</div>
                        <div class="info-value" id="distance">384,400 km</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">角直径</div>
                        <div class="info-value" id="angularDiameter">0.52°</div>
                    </div>
                </div>
            </div>

            <div class="controls-section">
                <h2><i class="fas fa-sun"></i> 光源控制</h2>
                <div class="slider-container">
                    <div class="slider-label">
                        <span><i class="fas fa-compass"></i> 太阳方位角</span>
                        <span class="slider-value" id="lightAngleValue">0°</span>
                    </div>
                    <input type="range" id="lightAngle" min="0" max="360" value="0" step="1">
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span><i class="fas fa-lightbulb"></i> 光照强度</span>
                        <span class="slider-value" id="lightIntensityValue">1.5</span>
                    </div>
                    <input type="range" id="lightIntensity" min="0.5" max="3" value="1.5" step="0.1">
                </div>

                <button id="resetLight">
                    <i class="fas fa-redo"></i> 重置光源
                </button>
            </div>

            <div class="controls-section">
                <h2><i class="fas fa-sliders-h"></i> 显示设置</h2>
                <div class="form-group">
                    <label><i class="fas fa-palette"></i> 月球颜色</label>
                    <select id="moonColor">
                        <option value="gray">灰色 (真实)</option>
                        <option value="white">白色</option>
                        <option value="blue">蓝色</option>
                        <option value="gold">金色</option>
                    </select>
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span><i class="fas fa-tachometer-alt"></i> 自转速度</span>
                        <span class="slider-value" id="rotationSpeedValue">1.0x</span>
                    </div>
                    <input type="range" id="rotationSpeed" min="0" max="2" value="1" step="0.1">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoRotate" checked> <i class="fas fa-sync"></i> 自动旋转
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="showStars" checked> <i class="fas fa-star"></i> 显示星空背景
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let scene, camera, renderer, moon, sunLight, stars, controls;
        let isInitialized = false;
        let moonRotationSpeed = 0.002;
        let autoRotate = true;
        let showStars = true;

        // DOM元素
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        const useCurrentTimeBtn = document.getElementById('useCurrentTime');
        const phaseName = document.getElementById('phaseName');
        const phaseFill = document.getElementById('phaseFill');
        const illumination = document.getElementById('illumination');
        const moonAge = document.getElementById('moonAge');
        const distance = document.getElementById('distance');
        const angularDiameter = document.getElementById('angularDiameter');
        const lightAngle = document.getElementById('lightAngle');
        const lightAngleValue = document.getElementById('lightAngleValue');
        const lightIntensity = document.getElementById('lightIntensity');
        const lightIntensityValue = document.getElementById('lightIntensityValue');
        const resetLightBtn = document.getElementById('resetLight');
        const moonColorSelect = document.getElementById('moonColor');
        const rotationSpeed = document.getElementById('rotationSpeed');
        const rotationSpeedValue = document.getElementById('rotationSpeedValue');
        const autoRotateCheckbox = document.getElementById('autoRotate');
        const showStarsCheckbox = document.getElementById('showStars');
        const toggleControlsBtn = document.getElementById('toggleControls');
        const controlsPanel = document.getElementById('controls');
        const status = document.getElementById('status');

        // 初始化
        try {
            init();
        } catch (error) {
            console.error('初始化错误:', error);
            status.innerHTML = '<i class="fas fa-exclamation-circle"></i> 错误: ' + error.message;
        }

        function init() {
            console.log('开始初始化高级月相模拟器...');
            status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在初始化...';

            // 检查Three.js是否加载
            if (!window.THREE) {
                throw new Error('Three.js未加载');
            }

            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2a);

            // 创建相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 4);

            // 创建渲染器
            const canvas = document.getElementById('moonCanvas');
            try {
                renderer = new THREE.WebGLRenderer({
                    canvas: canvas,
                    antialias: true,
                    alpha: true
                });
            } catch (error) {
                console.error('WebGL创建失败:', error);
                status.innerHTML = '<i class="fas fa-exclamation-circle"></i> WebGL不支持或创建失败';
                return;
            }

            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            console.log('渲染器创建成功');

            // 添加轨道控制
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1.5;
            controls.maxDistance = 10;
            controls.maxPolarAngle = Math.PI;

            // 创建星空背景
            createStarfield();

            // 创建月球
            createMoon();

            // 添加光源
            createLights();

            // 事件监听器
            setupEventListeners();

            // 初始更新
            useCurrentTime();

            isInitialized = true;
            status.innerHTML = '<i class="fas fa-check-circle"></i> 就绪';
            console.log('初始化完成');

            // 开始动画循环
            animate();
        }

        function createMoon() {
            console.log('创建月球...');
            const geometry = new THREE.SphereGeometry(1, 64, 64);

            // 使用Phong材质以获得更好的光照效果
            const material = new THREE.MeshPhongMaterial({
                color: 0x888888,
                shininess: 10,
                specular: 0x333333,
                emissive: 0x000000,
                emissiveIntensity: 0.1
            });

            moon = new THREE.Mesh(geometry, material);
            moon.castShadow = true;
            moon.receiveShadow = true;
            moon.position.set(0, 0, 0);
            scene.add(moon);
            console.log('月球创建完成');
        }

        function createStarfield() {
            console.log('创建星空背景...');
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 5000;

            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount * 3; i += 3) {
                // 随机位置
                positions[i] = (Math.random() - 0.5) * 2000;
                positions[i + 1] = (Math.random() - 0.5) * 2000;
                positions[i + 2] = (Math.random() - 0.5) * 2000;

                // 随机颜色（偏白/蓝）
                const colorIntensity = Math.random() * 0.8 + 0.2;
                colors[i] = colorIntensity;
                colors[i + 1] = colorIntensity * 0.9;
                colors[i + 2] = colorIntensity;

                // 随机大小
                sizes[i/3] = Math.random() * 1.5 + 0.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 1.2,
                sizeAttenuation: true,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
            console.log('星空背景创建完成');
        }

        function createLights() {
            console.log('创建光源...');
            // 太阳光源
            sunLight = new THREE.DirectionalLight(0xfff4e6, 1.5);
            sunLight.position.set(5, 3, 5);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 50;
            scene.add(sunLight);

            // 环境光
            const ambientLight = new THREE.AmbientLight(0x333344, 0.4);
            scene.add(ambientLight);

            // 背光（模拟地球反照）
            const backLight = new THREE.DirectionalLight(0xffffff, 0.2);
            backLight.position.set(-3, -1, -2);
            scene.add(backLight);
            console.log('光源创建完成');
        }

        function setupEventListeners() {
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 控制面板事件
            dateInput.addEventListener('change', updateMoonPhase);
            timeInput.addEventListener('change', updateMoonPhase);
            useCurrentTimeBtn.addEventListener('click', useCurrentTime);

            lightAngle.addEventListener('input', function() {
                lightAngleValue.textContent = `${this.value}°`;
                updateLightPosition();
            });

            lightIntensity.addEventListener('input', function() {
                const intensity = parseFloat(this.value);
                lightIntensityValue.textContent = intensity.toFixed(1);
                sunLight.intensity = intensity;
            });

            resetLightBtn.addEventListener('click', function() {
                lightAngle.value = 0;
                lightAngleValue.textContent = "0°";
                lightIntensity.value = 1.5;
                lightIntensityValue.textContent = "1.5";
                updateLightPosition();
                sunLight.intensity = 1.5;
            });

            moonColorSelect.addEventListener('change', function() {
                updateMoonColor(this.value);
            });

            rotationSpeed.addEventListener('input', function() {
                const speed = parseFloat(this.value);
                rotationSpeedValue.textContent = `${speed.toFixed(1)}x`;
                moonRotationSpeed = 0.002 * speed;
            });

            autoRotateCheckbox.addEventListener('change', function() {
                autoRotate = this.checked;
            });

            showStarsCheckbox.addEventListener('change', function() {
                showStars = this.checked;
                if (stars) {
                    stars.visible = this.checked;
                }
            });

            toggleControlsBtn.addEventListener('click', function() {
                controlsPanel.classList.toggle('active');
                const icon = this.querySelector('i');
                if (controlsPanel.classList.contains('active')) {
                    icon.classList.remove('fa-cogs');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-cogs');
                }
            });

            console.log('事件监听器设置完成');
        }

        function onWindowResize() {
            if (!camera || !renderer) return;

            const canvas = document.getElementById('moonCanvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        function updateLightPosition() {
            if (!sunLight) return;

            const angle = parseFloat(lightAngle.value) * Math.PI / 180;
            sunLight.position.x = Math.cos(angle) * 5;
            sunLight.position.z = Math.sin(angle) * 5;
            sunLight.position.y = 2;
        }

        function updateMoonColor(color) {
            if (!moon || !moon.material) return;

            let colorValue;
            switch(color) {
                case 'white':
                    colorValue = 0xffffff;
                    break;
                case 'blue':
                    colorValue = 0x88aaff;
                    break;
                case 'gold':
                    colorValue = 0xffcc66;
                    break;
                default: // gray
                    colorValue = 0x888888;
            }

            moon.material.color.set(colorValue);
        }

        function useCurrentTime() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);

            dateInput.value = dateStr;
            timeInput.value = timeStr;

            updateMoonPhase();
        }

        function updateMoonPhase() {
            const date = dateInput.value;
            const time = timeInput.value;

            if (!date || !time) return;

            const dateTime = new Date(`${date}T${time}`);
            const phaseData = calculateMoonPhase(dateTime);

            // 更新显示
            phaseName.textContent = phaseData.phaseName;
            illumination.textContent = `${Math.round(phaseData.illumination * 100)}%`;
            moonAge.textContent = `${phaseData.moonAge.toFixed(1)} 天`;

            // 更新距离和角直径（模拟值）
            const moonDist = 384400 + Math.sin(Date.now() * 0.00000001) * 21000;
            distance.textContent = `${Math.round(moonDist).toLocaleString('en-US')} km`;

            const angularSize = 0.5184 - Math.sin(Date.now() * 0.00000001) * 0.05;
            angularDiameter.textContent = `${angularSize.toFixed(2)}°`;

            // 使用动画更新进度条
            const currentWidth = parseFloat(phaseFill.style.width) || 100;
            const targetWidth = phaseData.illumination * 100;

            // 简单动画
            let startTime = null;
            const duration = 800;

            function animateProgress(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);

                // 缓动函数
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentWidthValue = currentWidth + (targetWidth - currentWidth) * easeOut;

                phaseFill.style.width = `${currentWidthValue}%`;

                if (progress < 1) {
                    requestAnimationFrame(animateProgress);
                }
            }

            requestAnimationFrame(animateProgress);

            // 根据月相调整光照位置
            const angle = phaseData.phase * Math.PI * 2;
            const targetAngle = Math.round(angle * 180 / Math.PI);

            lightAngle.value = targetAngle;
            lightAngleValue.textContent = `${targetAngle}°`;
            updateLightPosition();

            // 根据月相调整月球材质
            if (moon && moon.material) {
                const brightness = 0.3 + phaseData.illumination * 0.7;
                moon.material.emissiveIntensity = phaseData.illumination * 0.1;
            }
        }

        function calculateMoonPhase(date) {
            // 基于Jean Meeus《天文算法》的月相计算
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hour = date.getHours() + date.getMinutes() / 60;

            // 计算儒略日
            let jd = (367 * year)
                - Math.floor(7 * (year + Math.floor((month + 9) / 12)) / 4)
                + Math.floor(275 * month / 9)
                + day + 1721013.5
                + (hour / 24);

            // 计算自2000年1月6日（新月）以来的天数
            const daysSinceNew = jd - 2451549.5;

            // 月相周期（29.53058867天）
            const lunation = daysSinceNew / 29.53058867;
            const phase = lunation - Math.floor(lunation);

            // 月龄（天数）
            const age = phase * 29.53;

            // 照明比例和月相名称
            let illumination, phaseName;

            if (phase < 0.03 || phase >= 0.97) {
                phaseName = "新月";
                illumination = 0;
            } else if (phase < 0.22) {
                phaseName = "蛾眉月";
                illumination = phase / 0.22;
            } else if (phase < 0.28) {
                phaseName = "上弦月";
                illumination = 0.5;
            } else if (phase < 0.47) {
                phaseName = "盈凸月";
                illumination = 0.5 + (phase - 0.28) / 0.38;
            } else if (phase < 0.53) {
                phaseName = "满月";
                illumination = 1;
            } else if (phase < 0.72) {
                phaseName = "亏凸月";
                illumination = 1 - (phase - 0.53) / 0.38;
            } else if (phase < 0.78) {
                phaseName = "下弦月";
                illumination = 0.5;
            } else {
                phaseName = "残月";
                illumination = (0.97 - phase) / 0.19 * 0.5;
            }

            return {
                phase: phase,
                phaseName: phaseName,
                illumination: Math.max(0, Math.min(1, illumination)),
                moonAge: age
            };
        }

        function animate() {
            if (!isInitialized) {
                requestAnimationFrame(animate);
                return;
            }

            requestAnimationFrame(animate);

            // 更新控制
            controls.update();

            // 月球自转
            if (moon && autoRotate) {
                moon.rotation.y += moonRotationSpeed;
            }

            // 渲染场景
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // 初始调整大小
        setTimeout(() => {
            onWindowResize();
        }, 100);
    </script>
